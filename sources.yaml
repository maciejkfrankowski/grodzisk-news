# Katalog źródeł. Pełna lista kandydatów: docs/02-zrodla.md
# adapter: rss | html_links | tribe_events
#   html_links: wymaga link_pattern (regex na pełnym URL wpisu); opcje: strip, require_date
#   tribe_events: REST API kalendarza WordPress (wydarzenia z terminem)
sources:
  - id: gmina
    name: Urząd Miejski w Grodzisku Mazowieckim
    category: miasto
    adapter: rss
    url: https://grodzisk.pl/feed
    fallback_urls:            # używane, gdy główny adres zwróci 0 wpisów
      - https://grodzisk.pl/feed/
      - https://grodzisk.pl/?feed=rss2
      - https://grodzisk.pl/category/wiadomosci/feed/
    home: https://grodzisk.pl

  - id: powiat
    name: Powiat Grodziski
    category: powiat
    adapter: html_links
    url: https://www.powiat-grodziski.pl/aktualnosci/wszystkie/
    link_pattern: '/aktualnosci/\d+/?$'
    strip: ['\(Zam:[^)]*\)\s*\d*']   # „(Zam: data, godz.) liczba odsłon” doklejane do tytułu
    home: https://www.powiat-grodziski.pl

  - id: gpa
    name: Grodziskie Przewozy Autobusowe
    category: transport
    adapter: html_links
    url: https://gpagrodzisk.pl/aktualnosci/wszystkie/
    link_pattern: '/aktualnosci/\d+/?$'
    strip: ['\(Zam:[^)]*\)\s*\d*']   # „(Zam: data, godz.) liczba odsłon” doklejane do tytułu
    home: https://gpagrodzisk.pl

  - id: biblioteka
    name: Biblioteka Publiczna Gminy Grodzisk Mazowiecki
    category: kultura
    adapter: rss
    url: https://biblioteka.grodzisk.pl/feed/
    home: https://biblioteka.grodzisk.pl

  - id: ck-wydarzenia
    name: Centrum Kultury
    category: kultura
    adapter: tribe_events
    url: https://www.centrumkultury.eu/wp-json/tribe/events/v1/events?per_page=50
    home: https://www.centrumkultury.eu/wydarzenia/

  - id: ck
    name: Centrum Kultury – ogłoszenia
    category: kultura
    adapter: rss
    url: https://www.centrumkultury.eu/feed/
    home: https://www.centrumkultury.eu

  - id: psp
    name: Straż Pożarna – KP PSP w Grodzisku Mazowieckim
    category: bezpieczenstwo
    adapter: html_links
    url: https://www.gov.pl/web/kppsp-grodzisk-mazowiecki/aktualnosci
    link_pattern: '/web/kppsp-grodzisk-mazowiecki/[^/?#]+$'
    require_date: true        # wzorzec łapie też menu; wpisy z listy mają datę
    home: https://www.gov.pl/web/kppsp-grodzisk-mazowiecki
