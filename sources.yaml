# Katalog źródeł. Pełna lista kandydatów: docs/02-zrodla.md
# adapter: rss | html_links | tribe_events
#   html_links: wymaga link_pattern (regex na pełnym URL wpisu); opcje: strip, require_date, events
#   tribe_events: REST API kalendarza WordPress (wydarzenia z terminem)
# opcje wspólne: enabled (false = pomiń), exclude_title (regex – pomija wpisy o takim tytule)
sources:
  - id: gmina
    name: Urząd Miejski w Grodzisku Mazowieckim
    category: miasto
    adapter: rss
    url: https://grodzisk.pl/feed
    fallback_urls:            # używane, gdy główny adres zwróci 0 wpisów
      - https://grodzisk.pl/feed/
      - https://grodzisk.pl/?feed=rss2
      - https://grodzisk.pl/category/wiadomosci/feed/
    home: https://grodzisk.pl

  - id: powiat
    name: Powiat Grodziski
    category: powiat
    adapter: html_links
    url: https://www.powiat-grodziski.pl/aktualnosci/wszystkie/
    link_pattern: '/aktualnosci/\d+/?$'
    strip: ['\(Zam:[^)]*\)\s*\d*']   # „(Zam: data, godz.) liczba odsłon” doklejane do tytułu
    home: https://www.powiat-grodziski.pl

  - id: gpa
    name: Grodziskie Przewozy Autobusowe
    category: transport
    adapter: html_links
    url: https://gpagrodzisk.pl/aktualnosci/wszystkie/
    link_pattern: '/aktualnosci/\d+/?$'
    strip: ['\(Zam:[^)]*\)\s*\d*']   # „(Zam: data, godz.) liczba odsłon” doklejane do tytułu
    home: https://gpagrodzisk.pl

  - id: biblioteka
    name: Biblioteka Publiczna Gminy Grodzisk Mazowiecki
    category: kultura
    adapter: rss
    url: https://biblioteka.grodzisk.pl/feed/
    home: https://biblioteka.grodzisk.pl

  - id: ck-wydarzenia
    name: Centrum Kultury
    category: kultura
    adapter: tribe_events
    url: https://www.centrumkultury.eu/wp-json/tribe/events/v1/events?per_page=50
    home: https://www.centrumkultury.eu/wydarzenia/

  - id: ck
    name: Centrum Kultury – ogłoszenia
    category: kultura
    adapter: rss
    url: https://www.centrumkultury.eu/feed/
    home: https://www.centrumkultury.eu

  - id: psp
    name: Straż Pożarna – KP PSP w Grodzisku Mazowieckim
    category: bezpieczenstwo
    adapter: html_links
    url: https://www.gov.pl/web/kppsp-grodzisk-mazowiecki/aktualnosci
    link_pattern: '/web/kppsp-grodzisk-mazowiecki/[^/?#]+$'
    require_date: true        # wzorzec łapie też menu; wpisy z listy mają datę
    enabled: false            # gov.pl nieosiągalne z serwerów GitHub Actions; włączyć po migracji na VPS
    home: https://www.gov.pl/web/kppsp-grodzisk-mazowiecki

  - id: osir
    name: OSiR Grodzisk Mazowiecki
    category: sport
    adapter: rss
    url: https://grodzisksport.pl/rss/aktualnosci.xml
    home: https://grodzisksport.pl

  - id: solectwa
    name: Sołectwa Gminy Grodzisk Mazowiecki
    category: miasto
    adapter: rss
    url: https://solectwa.grodzisk.pl/feed/
    home: https://solectwa.grodzisk.pl

  - id: szpital
    name: Szpital Zachodni
    category: zdrowie
    adapter: rss
    url: https://szpitalzachodni.pl/feed/
    exclude_title: '^(konkurs ofert|jadłospis)'
    home: https://szpitalzachodni.pl

  - id: wkd
    name: Warszawska Kolej Dojazdowa
    category: transport
    adapter: rss
    url: https://wkd.com.pl/aktualnosci?format=feed&type=rss
    home: https://wkd.com.pl
    enabled: false   # 403 dla GitHub Actions (strona HTML i RSS); włączyć po migracji na VPS lub zgodzie WKD

  - id: policja
    name: Policja – KPP w Grodzisku Mazowieckim
    category: bezpieczenstwo
    adapter: html_links
    url: https://grodzisk.policja.gov.pl/pgm/aktualnosci
    # tylko wpisy własne komendy; lista zawiera też komunikaty KSP i policja.pl
    link_pattern: 'grodzisk\.policja\.gov\.pl/pgm/aktualnosci/\d+,[^/?#]+\.html$'
    require_date: true
    home: https://grodzisk.policja.gov.pl

  - id: osir-wydarzenia
    name: OSiR Grodzisk Mazowiecki
    category: sport
    adapter: html_links
    url: https://grodzisksport.pl/
    link_pattern: 'grodzisksport\.pl/kalendarz-wydarzen/.+\.html$'
    events: true              # termin z listy „Najnowsze wydarzenia” (DD - MM - RRRR, Godz. GG:MM)
    home: https://grodzisksport.pl/kalendarz-wydarzen/
