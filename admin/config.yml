# Panel redakcji (Sveltia CMS). Zapisuje pliki do repo przez API GitHuba;
# każdy zapis to commit na main, który uruchamia przebudowę strony.
backend:
  name: github
  repo: maciejkfrankowski/grodzisk-news
  branch: main
  skip_ci: false
  commit_messages:
    create: "artykul: nowy „{{slug}}”"
    update: "artykul: zmiana „{{slug}}”"
    delete: "artykul: usuniecie „{{slug}}”"
    uploadMedia: "media: dodano {{path}}"
    deleteMedia: "media: usunieto {{path}}"

site_url: https://maciejkfrankowski.github.io/grodzisk-news/
display_url: https://maciejkfrankowski.github.io/grodzisk-news/

media_folder: static/img/uploads
public_folder: static/img/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: articles
    label: Artykuły
    label_singular: Artykuł
    folder: content/articles
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - {label: Tytuł, name: title, widget: string}
      - {label: Data publikacji, name: date, widget: datetime, type: date}
      - label: Kategoria
        name: category
        widget: select
        default: redakcja
        options:          # slugi muszą zgadzać się z site.yaml
          - {label: Od redakcji, value: redakcja}
          - {label: Miasto i gmina, value: miasto}
          - {label: Powiat, value: powiat}
          - {label: Kultura, value: kultura}
          - {label: Sport, value: sport}
          - {label: Zdrowie, value: zdrowie}
          - {label: Bezpieczeństwo, value: bezpieczenstwo}
          - {label: Transport, value: transport}
      - {label: Zajawka, name: lead, widget: text, required: false, hint: "Jedno–dwa zdania widoczne na kartach i pod tytułem."}
      - {label: Zdjęcie, name: image, widget: image, required: false}
      - {label: Źródło zdjęcia, name: image_credit, widget: string, required: false, hint: "Autor lub instytucja, np. UM Grodzisk Mazowiecki. Wyświetla się jako „Fot. …”."}
      - {label: Wyróżnij na stronie głównej, name: featured, widget: boolean, default: false, hint: "Najnowszy wyróżniony artykuł trafia na górę strony głównej."}
      - {label: Szkic (nie publikuj), name: draft, widget: boolean, default: false}
      - {label: Treść, name: body, widget: markdown}
  - name: releases
    label: Artykuły z komunikatów
    label_singular: Artykuł z komunikatu
    folder: content/komunikaty
    create: false
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} ({{date}}) {{check_notes}}"
    sortable_fields: [date, title]
    fields:
      - {label: Szkic (nie publikuj), name: draft, widget: boolean, default: true, hint: "Odznacz, żeby opublikować."}
      - {label: Uwagi automatu, name: check_notes, widget: string, required: false, hint: "Co kontrola uznała za niepewne. Sprawdź z komunikatem."}
      - {label: Tytuł, name: title, widget: string}
      - {label: Zajawka, name: lead, widget: text, required: false}
      - {label: Treść, name: body, widget: markdown}
      - {label: Źródło, name: source_name, widget: string}
      - {label: Adres komunikatu, name: source_url, widget: string}
      - {label: Data publikacji, name: date, widget: datetime, type: date}
      - label: Kategoria
        name: category
        widget: select
        options:
          - {label: Miasto i gmina, value: miasto}
          - {label: Powiat, value: powiat}
          - {label: Kultura, value: kultura}
          - {label: Sport, value: sport}
          - {label: Zdrowie, value: zdrowie}
          - {label: Bezpieczeństwo, value: bezpieczenstwo}
          - {label: Transport, value: transport}
      - {name: item_id, widget: hidden}
