# Katalog scen puli ilustracji (static/img/topics-photo/) dla doboru zdjęć modelem AI (gn/photo_ai.py).
# Klucz sceny = nazwa pliku bez rozszerzenia. Opisy sprawdzone z obrazami 23.11.2026.
# Po podmianie lub dodaniu obrazu popraw tu jego opis; plik bez opisu nie jest proponowany modelowi.
# `use` = o czym są artykuły z tej grupy (po angielsku, bo trafia do promptu wspólnego dla pl i de).

boar:
  use: wild boars in town, culling, African swine fever
  scenes:
    boar-1: a sow with striped piglets crossing a town street in daylight
    boar-2: a single boar rooting in the grass verge beside a pavement
    boar-3: a boar at night next to an overturned rubbish bin with spilled waste
    boar-4: a group of boars with a piglet walking down a misty street
    boar-5: a boar standing on a pavement by a metal fence
    boar-6: a boar close-up at dusk by a playground fence

